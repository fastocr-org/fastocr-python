[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fastocr-sdk"
dynamic = ["version"]
description = "Python client for the FastOCR Document OCR API: extract text and searchable PDFs from scanned PDFs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ocr", "pdf", "searchable-pdf", "document-ai", "text-extraction", "rag", "fastocr"]
authors = [
    { name = "FastOCR", email = "support@fastocr.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://fastocr.org"
Documentation = "https://fastocr.org/docs/documents"
Repository = "https://github.com/fastocr-org/fastocr-python"
Changelog = "https://github.com/fastocr-org/fastocr-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/fastocr-org/fastocr-python/issues"

[tool.hatch.version]
path = "src/fastocr_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fastocr_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
